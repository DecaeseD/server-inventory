<div class="line">
  <div class="head">
    <span class="ln">#</span>
    <span class="kind"><span class="kind-op">قلم جدید</span> <small class="kind-sub"></small></span>
    <span class="sp"></span>
    <button type="button" class="btn sec sm rm">حذف</button>
  </div>
  {% if form.non_field_errors %}<div class="errbox">{{ form.non_field_errors|join:" " }}</div>{% endif %}
  <div class="row">
  {% for f in form.visible_fields %}
    <div class="fld f-{{ f.name }}{% if f.name == 'serials' or f.name == 'note' %} wide{% endif %}">
      <label for="{{ f.id_for_label }}">{{ f.label }}</label>{{ f }}
      {% if f.help_text %}<div class="hint">{{ f.help_text }}</div>{% endif %}
      <div class="hint serial-hint hide"></div>
      {% for e in f.errors %}<div class="err">{{ e }}</div>{% endfor %}
    </div>
  {% endfor %}
  </div>
  <div class="foot"><button type="button" class="btn parts add-parts hide">+ افزودن سخت‌افزار همراه این سرور (رم، CPU، هارد، ...)</button></div>
</div>
